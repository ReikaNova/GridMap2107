<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Carte opérationnelle 20 km de Bruxelles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* Bouton recherche adresse */
    #open-search-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1001;
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
      font-weight: bold;
    }

    #open-search-btn:hover {
      background: #0056b3;
    }

    /* Modal recherche adresse */
    #search-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1002;
    }

    #search-modal.active {
      display: flex;
    }

    #search-content {
      background: white;
      width: 90%;
      max-width: 1000px;
      height: 70%;
      display: flex;
      border-radius: 8px;
      overflow: hidden;
    }

    #modal-left {
      flex: 1;
      padding: 20px;
      position: relative;
      overflow-y: auto;
    }

    #modal-center {
      flex: 1;
      padding: 20px;
      border-left: 1px solid #ddd;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    #modal-right {
      flex: 1.5;
    }

    #search-map {
      height: 100%;
      width: 100%;
    }

    #close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      cursor: pointer;
    }

    #modal-left label {
      margin-top: 10px;
      font-weight: bold;
      display: block;
    }

    #modal-left input,
    #modal-left textarea {
      margin-top: 4px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    #modal-left textarea {
      resize: vertical;
      height: 80px;
    }

    #modal-left button {
      margin-top: 15px;
      padding: 8px 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #modal-close-btn {
      background: #dc3545 !important;
    }

    #suggestions {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 100%;
      overflow-y: auto;
    }

    #suggestions li {
      padding: 6px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    #suggestions li:hover {
      background: #f0f0f0;
    }

    /* Sidebar infos */
    #sidebar {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 100%;
      background: white;
      border-left: 2px solid gray;
      padding: 10px;
      overflow-y: auto;
      display: none;
      z-index: 1000;
      box-shadow: -2px 0 4px rgba(0,0,0,0.2);
    }

    /* Menu clic droit */
    .context-menu {
      position: absolute;
      z-index: 9999;
      background: white;
      border: 1px solid gray;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      padding: 5px;
      display: none;
      border-radius: 4px;
    }

    .context-menu button {
      width: 100%;
      padding: 6px 10px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .context-menu button:hover {
      background: #eee;
    }

    /* Labels */
    .service-label,
    .hospital-label,
    .km-label {
      background: white;
      color: black;
      font-weight: bold;
      border-radius: 4px;
      padding: 2px 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
      border: 1px solid #aaa;
    }

    .km-label {
      font-size: 12px;
      background: #fff3cd;
    }

    .leaflet-control-layers {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <button id="open-search-btn">Rechercher une adresse</button>

  <!-- Modal recherche adresse -->
  <div id="search-modal">
    <div id="search-content">
      <div id="modal-left">
        <span id="close-modal">&times;</span>
        <h3>Rechercher une adresse</h3>

        <label for="addr-street">Rue</label>
        <input id="addr-street" type="text" placeholder="Nom de la rue..." />

        <label for="addr-number">Numéro</label>
        <input id="addr-number" type="text" placeholder="Numéro de maison..." />

        <label for="addr-commune">Commune</label>
        <input id="addr-commune" type="text" placeholder="Ex : Bruxelles" />

        <label for="addr-comment">Commentaire</label>
        <textarea id="addr-comment" placeholder="Détails optionnels..."></textarea>

        <button id="search-submit" type="button">Valider</button>
        <button id="modal-close-btn" type="button">Fermer</button>
      </div>

      <div id="modal-center">
        <h4>Suggestions</h4>
        <ul id="suggestions"></ul>
      </div>

      <div id="modal-right">
        <div id="search-map"></div>
      </div>
    </div>
  </div>

  <div id="sidebar"></div>
  <div id="context-menu" class="context-menu"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // =====================================================
    // CARTE PRINCIPALE
    // =====================================================
    const map = L.map('map').setView([50.8445, 4.3857], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // =====================================================
    // MODAL DE RECHERCHE D'ADRESSE
    // =====================================================
    const modal = document.getElementById('search-modal');
    const openBtn = document.getElementById('open-search-btn');
    const closeIcon = document.getElementById('close-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const subMapDiv = document.getElementById('search-map');

    const streetInput = document.getElementById('addr-street');
    const numInput = document.getElementById('addr-number');
    const communeInput = document.getElementById('addr-commune');
    const suggestions = document.getElementById('suggestions');

    let subMap = null;
    let subMarker = null;
    let debounceTimer = null;

    function initSubMap() {
      if (subMap) {
        setTimeout(() => subMap.invalidateSize(), 100);
        return;
      }

      subMap = L.map(subMapDiv).setView([50.8445, 4.3857], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 22,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(subMap);
    }

    openBtn.onclick = () => {
      modal.classList.add('active');
      setTimeout(initSubMap, 100);
    };

    function closeModal() {
      modal.classList.remove('active');
    }

    closeIcon.onclick = closeModal;
    modalCloseBtn.onclick = closeModal;

    [streetInput, numInput, communeInput].forEach(el => {
      el.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        if (!streetInput.value.trim()) {
          suggestions.innerHTML = '';
          return;
        }
        debounceTimer = setTimeout(updateSuggestions, 300);
      });
    });

    function updateSuggestions() {
      initSubMap();

      const street = streetInput.value.trim();
      const number = numInput.value.trim();
      const commune = communeInput.value.trim() || 'Bruxelles';

      suggestions.innerHTML = '';
      if (!street) return;

      if (!number) {
        const overpassQuery = `
          [out:json][timeout:25];
          area[name="${commune}"]->.a;
          way["highway"]["name"~"${street}",i](area.a);
          out center;`;

        fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: overpassQuery
        })
          .then(r => r.json())
          .then(data => {
            if (!data.elements || !data.elements.length) return;

            data.elements.forEach(el => {
              const name = el.tags && el.tags.name;
              if (!name || !el.center) return;

              const li = document.createElement('li');
              li.textContent = `${name}, ${commune}`;

              li.addEventListener('mouseenter', () => {
                const ll = [el.center.lat, el.center.lon];
                subMap.setView(ll, 18);
                if (subMarker) subMap.removeLayer(subMarker);
                subMarker = L.marker(ll, { draggable: true }).addTo(subMap);
              });

              li.addEventListener('click', () => {
                streetInput.value = name;
                numInput.value = '';
                suggestions.innerHTML = '';
              });

              suggestions.appendChild(li);
            });
          })
          .catch(err => console.error('Erreur Overpass :', err));
      } else {
        const params = new URLSearchParams({
          format: 'json',
          limit: 10,
          countrycodes: 'be',
          addressdetails: 1,
          'accept-language': 'fr',
          street: street,
          housenumber: number,
          city: commune
        });

        fetch(`https://nominatim.openstreetmap.org/search?${params.toString()}`)
          .then(r => r.json())
          .then(data => {
            data.forEach(item => {
              const li = document.createElement('li');
              li.textContent = item.display_name;

              li.addEventListener('mouseenter', () => {
                const ll = [parseFloat(item.lat), parseFloat(item.lon)];
                subMap.setView(ll, 18);
                if (subMarker) subMap.removeLayer(subMarker);
                subMarker = L.marker(ll, { draggable: true }).addTo(subMap);
              });

              li.addEventListener('click', () => {
                streetInput.value = street;
                numInput.value = number;
                suggestions.innerHTML = '';
              });

              suggestions.appendChild(li);
            });
          })
          .catch(err => console.error('Erreur Nominatim :', err));
      }
    }

    document.getElementById('search-submit').onclick = () => {
      const addr = `${streetInput.value} ${numInput.value || ''}, ${communeInput.value || 'Bruxelles'}`;
      initSubMap();

      fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`)
        .then(r => r.json())
        .then(d => {
          if (!d.length) return;

          const ll = [parseFloat(d[0].lat), parseFloat(d[0].lon)];

          if (subMarker) subMap.removeLayer(subMarker);
          subMarker = L.marker(ll, { draggable: true }).addTo(subMap);
          subMap.setView(ll, 18);
        })
        .catch(err => console.error('Erreur recherche adresse :', err));
    };

    // =====================================================
    // COUCHES OPERATIONNELLES 20 KM
    // =====================================================
    const parcoursLayer = L.layerGroup().addTo(map);
    const medicalLayer = L.layerGroup().addTo(map);
    const ravitoLayer = L.layerGroup().addTo(map);
    const policeLayer = L.layerGroup().addTo(map);
    const betonLayer = L.layerGroup().addTo(map);
    const accesLayer = L.layerGroup().addTo(map);
    const autresLayer = L.layerGroup();

    function getLineStyle(lowerName, geomType) {
      if (
        geomType === 'LineString' ||
        geomType === 'MultiLineString' ||
        lowerName.includes('racetrack') ||
        lowerName.includes('parcours')
      ) {
        return {
          color: 'red',
          weight: 5,
          opacity: 0.9
        };
      }

      if (lowerName.includes('ambulance sur rail')) {
        return {
          color: 'blue',
          weight: 5,
          opacity: 0.9
        };
      }

      if (
        lowerName.includes('way in') ||
        lowerName.includes('way out')
      ) {
        return {
          color: 'blue',
          weight: 4,
          opacity: 0.9,
          dashArray: '5, 5'
        };
      }

      return {
        color: 'blue',
        weight: 3,
        opacity: 0.9
      };
    }

    function classifyFeature(feature) {
      const name = (feature.properties?.name || '').trim();
      const lowerName = name.toLowerCase();
      const geomType = feature.geometry?.type;

      let targetLayer = null;
      let icon = '📍';

      // Priorité 1 : toutes les lignes vont dans la couche parcours/acces selon leur nom
      if (geomType === 'LineString' || geomType === 'MultiLineString') {
        targetLayer = parcoursLayer;
      }

      // KM / départ / arrivée
      if (
        lowerName.includes('start') ||
        lowerName.includes('finish') ||
        lowerName.includes('km')
      ) {
        targetLayer = parcoursLayer;
        icon = '🏁';
      }

      // Médical
      if (
        lowerName.includes('pma') ||
        lowerName.includes('pedro')
      ) {
        targetLayer = medicalLayer;
        icon = '🏥';
      }

      // Ravitaillement
      if (
        lowerName.includes('ravitaillement')
      ) {
        targetLayer = ravitoLayer;
        icon = '🥤';
      }

      // Police
      if (
        lowerName.includes('vbp') ||
        lowerName.includes('monty') ||
        lowerName.includes('police')
      ) {
        targetLayer = policeLayer;
        icon = '👮';
      }

      // Blocs béton
      if (
        lowerName.includes('bloc béton') ||
        lowerName.includes('bloc beton') ||
        lowerName.includes('blocs béton') ||
        lowerName.includes('blocs beton') ||
        lowerName.includes('beton') ||
        lowerName.includes('béton')
      ) {
        targetLayer = betonLayer;
        icon = '🧱';
      }

      // Accès ambulances
      if (
        lowerName.includes('way in') ||
        lowerName.includes('way out') ||
        lowerName.includes('ambulance sur rail') ||
        lowerName.includes('rail tram')
      ) {
        targetLayer = accesLayer;
        icon = '🚑';
      }

      if (!targetLayer) {
        targetLayer = autresLayer;
      }

      return { name, lowerName, geomType, targetLayer, icon };
    }

    function loadOperationalGeoJSON() {
      fetch('./trace-20km.geojson')
        .then(r => {
          if (!r.ok) {
            throw new Error('Fichier trace-20km.geojson introuvable');
          }
          return r.json();
        })
        .then(data => {
          if (!data.features || !Array.isArray(data.features)) {
            throw new Error('GeoJSON invalide : aucune feature trouvée');
          }

          data.features.forEach(feature => {
            const info = classifyFeature(feature);
            const { name, lowerName, geomType, targetLayer, icon } = info;

            const geoLayer = L.geoJSON(feature, {
              style: function() {
                return getLineStyle(lowerName, geomType);
              },

              pointToLayer: function(feature, latlng) {
                // Pas d'icône sous les KM, départ et arrivée : seulement le label
                if (
                  lowerName.includes('km') ||
                  lowerName.includes('start') ||
                  lowerName.includes('départ') ||
                  lowerName.includes('depart') ||
                  lowerName.includes('finish') ||
                  lowerName.includes('arrivée') ||
                  lowerName.includes('arrivee')
                ) {
                  return L.circleMarker(latlng, {
                    radius: 1,
                    opacity: 0,
                    fillOpacity: 0
                  });
                }

                return L.marker(latlng, {
                  icon: L.divIcon({
                    html: `<div style="font-size:26px;line-height:1;">${icon}</div>`,
                    className: '',
                    iconSize: [26, 26],
                    iconAnchor: [13, 13]
                  })
                });
              },

              onEachFeature: function(feature, layer) {
                layer.bindPopup(`<b>${name || 'Élément 20 km'}</b>`);

                if (
                  lowerName.includes('km') ||
                  lowerName.includes('start') ||
                  lowerName.includes('départ') ||
                  lowerName.includes('depart') ||
                  lowerName.includes('finish') ||
                  lowerName.includes('arrivée') ||
                  lowerName.includes('arrivee')
                ) {
                  layer.bindTooltip(name, {
                    permanent: true,
                    direction: 'top',
                    className: 'km-label',
                    offset: [0, -8]
                  });
                }
              }
            });

            geoLayer.addTo(targetLayer);
          });

          const allLayers = L.featureGroup([
            parcoursLayer,
            medicalLayer,
            ravitoLayer,
            policeLayer,
            betonLayer,
            accesLayer
          ]);

          if (allLayers.getBounds().isValid()) {
            map.fitBounds(allLayers.getBounds());
          }
        })
        .catch(err => {
          console.error('Erreur lors du chargement du GeoJSON 20 km :', err);
});
    }

    loadOperationalGeoJSON();

    // =====================================================
    // CONTROLE DES COUCHES
    // =====================================================
    const overlays = {
      '🏁 Parcours / KM': parcoursLayer,
      '🏥 Médical / PMA / postes': medicalLayer,
      '🥤 Ravitaillements': ravitoLayer,
      '👮 Police - VBP / MONTY': policeLayer,
      '🧱 Blocs béton': betonLayer,
      '🚑 Accès ambulances / rails / way in-out': accesLayer,
      '📍 Autres éléments': autresLayer
    };

    L.control.layers(null, overlays, {
      collapsed: false
    }).addTo(map);

    // =====================================================
    // HOPITAUX VIA OVERPASS
    // =====================================================
    const hospitals = [];

    function loadHospitals() {
      const query = `
        [out:json][timeout:25];
        area[name="Brussels"]->.a;
        (
          node["amenity"="hospital"](area.a);
          node["emergency"="hospital"](area.a);
        );
        out body;`;

      fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: query
      })
        .then(r => r.json())
        .then(d => {
          if (!d.elements) return;

          d.elements.forEach(el => {
            if (!el.lat || !el.lon) return;

            const nm = el.tags?.name || 'Hôpital';

            const marker = L.marker([el.lat, el.lon], {
              icon: L.divIcon({
                html: '<div style="font-size:24px;line-height:1;">🏥</div>',
                className: '',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
              })
            }).addTo(map);

            marker.bindTooltip(nm, {
              direction: 'top',
              className: 'hospital-label'
            });

            marker.on('click', () => {
              fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${el.lat}&lon=${el.lon}`)
                .then(r => r.json())
                .then(dd => {
                  document.getElementById('sidebar').innerHTML = `
                    <h3>${nm}</h3>
                    <p>${dd.display_name || 'Adresse non disponible'}</p>
                    <button onclick="document.getElementById('sidebar').style.display='none'">Fermer</button>
                  `;
                  document.getElementById('sidebar').style.display = 'block';
                });
            });

            hospitals.push({ marker, coords: [el.lat, el.lon], name: nm });
          });
        })
        .catch(err => console.error('Erreur chargement hôpitaux :', err));
    }

    loadHospitals();

    // =====================================================
    // MENU CLIC DROIT : AJOUT TEMPORAIRE DE MARQUEURS
    // =====================================================
    let contextMarker = null;

    map.on('contextmenu', e => {
      const cm = document.getElementById('context-menu');
      cm.style.left = e.originalEvent.pageX + 'px';
      cm.style.top = e.originalEvent.pageY + 'px';
      cm.style.display = 'block';

      const { lat, lng } = e.latlng;

      cm.innerHTML = `
        <button onclick="showAddress(${lat}, ${lng})">Afficher adresse</button>
        <button onclick="addSvc('ambulance', ${lat}, ${lng})">Ajouter Ambulance</button>
        <button onclick="addSvc('poste', ${lat}, ${lng})">Ajouter Poste de soin</button>
        <button onclick="addSvc('intervention', ${lat}, ${lng})">Ajouter Intervention</button>
      `;
    });

    document.addEventListener('click', () => {
      document.getElementById('context-menu').style.display = 'none';
    });

    function showAddress(lat, lng) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(r => r.json())
        .then(d => {
          document.getElementById('sidebar').innerHTML = `
            <h3>Adresse</h3>
            <p>${d.display_name || 'Adresse non disponible'}</p>
            <button onclick="document.getElementById('sidebar').style.display='none'">Fermer</button>
          `;
          document.getElementById('sidebar').style.display = 'block';
        })
        .catch(err => console.error('Erreur reverse geocoding :', err));
    }

    function addSvc(type, lat, lng) {
      document.getElementById('context-menu').style.display = 'none';

      const nm = prompt(`Nom ${type} :`);
      if (!nm) return;

      const icons = {
        ambulance: '🚑',
        poste: '🏥',
        intervention: '⚠️'
      };

      const marker = L.marker([lat, lng], {
        draggable: true,
        icon: L.divIcon({
          html: `<div style="font-size:40px;line-height:1;">${icons[type]}</div>`,
          className: '',
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        })
      }).addTo(map);

      marker.bindTooltip(nm, {
        permanent: true,
        direction: 'top',
        className: 'service-label'
      }).openTooltip();

      marker.on('contextmenu', ev => {
        ev.originalEvent.stopPropagation();
        contextMarker = marker;

        const cm = document.getElementById('context-menu');
        cm.style.left = ev.originalEvent.pageX + 'px';
        cm.style.top = ev.originalEvent.pageY + 'px';
        cm.style.display = 'block';
        cm.innerHTML = '<button onclick="delMarker()">Supprimer</button>';
      });
    }

    function delMarker() {
      if (contextMarker) {
        map.removeLayer(contextMarker);
      }
      contextMarker = null;
      document.getElementById('context-menu').style.display = 'none';
    }
  </script>
</body>
</html>
